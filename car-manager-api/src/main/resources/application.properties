spring.application.name=car-manager-api

spring.datasource.url=jdbc:postgresql://localhost:5432/car_manager
spring.datasource.username=car_manager
spring.datasource.password=car_manager

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

spring.security.oauth2.resourceserver.jwt.secret-key=car-manager-jwt-secret-change-in-prod-32b

app.jwt.issuer=car-manager-api
app.jwt.expiration-minutes=120

app.exchange-rate.awesome-url=https://economia.awesomeapi.com.br/json/last/USD-BRL
app.exchange-rate.frankfurter-url=https://api.frankfurter.app/latest?from=USD&to=BRL
app.exchange-rate.cache-ttl-seconds=120

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.hibernate.SQL=warn
